# The dsh-Launch in One Click bundle patch: one row inserting the plugin.
#
# This file is deliberately a PLAIN insert — no `config:` row. A marketplace
# hot-mounts only a plain `id`/`name` insert, so this shape is what makes the
# plugin, and the launcher it writes to the Desktop, appear the moment someone
# clicks Install instead of after their next restart. Adding a config row here
# costs exactly that.
#
# Every default therefore lives in code, and each is overridable per deployment:
#
#   defaultPort      3080                port the generated launcher targets
#   language         auto                auto | en | zh — `auto` follows the console code page
#   runner           npx                 npx | dsh — how the generated launcher starts the harness
#   packageSpec      '@deepseek-ai/dsh'  package the npx runner resolves
#   openBrowser      true                let `dsh web` open the browser itself
#   provisionOnLoad  true                create the launcher on load, when absent
#   autoUpdate       true                refresh a launcher an earlier build wrote, keeping
#                                        the settings recorded inside it
#
# Removing the row (or the whole bundle) leaves an installed launcher .bat
# working: the launcher is self-contained and never imports this package.
- insert:
    - id: launch-in-one-click
      name: dsh-launch-in-one-click
